# Configuración de Render (Blueprint). En Render: New → Blueprint → elige este repositorio.
services:
  - type: web
    name: forest-war
    runtime: node
    # Plan gratis: no tiene disco, así que las cuentas se guardan en una carpeta
    # temporal y SE BORRAN cuando el servidor se reinicia o se actualiza.
    # Para guardarlas para siempre: cambia a "plan: starter" y añade un disco
    # (ver README).
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PASS_TRIAL_DAYS
        value: "7"
